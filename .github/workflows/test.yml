# Runs the real launchers on Linux, macOS and Windows: they download and verify
# Python, install the packages; then OCR data is downloaded and all tests run.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0, pinned to the commit

      - name: Launcher setup (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 >/dev/null
          ./start.sh --setup

      - name: Launcher setup (macOS, via start.command)
        if: runner.os == 'macOS'
        run: ./start.command --setup

      - name: Launcher setup (Windows, via start.cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: start.cmd setup

      - name: Interpreter chosen by the launcher
        run: |
          # same order as the launchers; python/venv is the system-Python fallback
          for c in python/python/python.exe python/bin/python3 python/python/bin/python3 python/venv/bin/python3; do
            if [ -x "$c" ]; then echo "PY=$c" >> "$GITHUB_ENV"; echo "$c"; exit 0; fi
          done
          echo "::error::no interpreter found under python/"; exit 1

      - name: Install OCR language packs (app code; English, German, French)
        run: |
          $PY -I -c "import sys; sys.path.insert(0, '.'); from app.ocr import OcrEngine; from app import config as c; OcrEngine(c.TESSDATA_DIR, 300, c.DEFAULTS['tessdata_url']).download(['eng', 'deu', 'fra'], print)" 2> ocr-error.txt || {
            cat ocr-error.txt
            echo "::error title=OCR download (${{ runner.os }})::$(tail -n 20 ocr-error.txt | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }

      - name: Unit tests
        run: $PY -I -W ignore tests/test_all.py

      - name: GUI smoke test
        run: $PY -I -W ignore tests/smoke_gui.py

      # start.cmd must treat folder names as text and roll back an interrupted update - including
      # replacing itself while it runs. The folder name would run "mkdir injected" if it were code.
      - name: Prepare launcher in a folder with special characters (Windows)
        if: runner.os == 'Windows'
        run: |
          d="$(cygpath -u "$RUNNER_TEMP")/acf & mkdir injected & rem (x)!"
          mkdir -p "$d/data/updates/backup-1.0.0"
          cp -r app tools advanced_ctrl_f.py requirements.txt requirements.in start.cmd "$d/"
          { printf '@echo off\r\necho restored>"%%~dp0old-launcher-ran.txt"\r\n'; tail -n +2 start.cmd; } > "$d/data/updates/backup-1.0.0/start.cmd"
          echo old > "$d/data/updates/backup-1.0.0/OLDFILE.txt"
          echo new > "$d/NEWFILE.txt"
          printf 'backup-1.0.0\r\nold start.cmd\r\nold OLDFILE.txt\r\nnew NEWFILE.txt\r\nold data\r\n' > "$d/data/updates/applying"
          echo "ACF_DIR=$(cygpath -w "$d")" >> "$GITHUB_ENV"

      - name: Run that launcher (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "PYTHON_BIN=%GITHUB_WORKSPACE%\python\python\python.exe"
          call "%ACF_DIR%\start.cmd" setup

      - name: Check rollback and that no folder name ran as a command (Windows)
        if: runner.os == 'Windows'
        run: |
          d="$(cygpath -u "$ACF_DIR")"
          cat "$d/data/setup.log"
          test -f "$d/old-launcher-ran.txt"        # the restored launcher was started
          test -f "$d/OLDFILE.txt" && test ! -e "$d/NEWFILE.txt" && test ! -e "$d/data/updates/applying"
          grep -q "rolled back" "$d/data/setup.log" && grep -q "Setup complete" "$d/data/setup.log"
          grep -q "acf & mkdir injected & rem (x)!" "$d/data/setup.log"   # the name is logged as text
          for w in "$d" "$GITHUB_WORKSPACE" "$(cygpath -u "$RUNNER_TEMP")"; do
            if [ -e "$w/injected" ]; then echo "::error::the folder name was run as a command"; exit 1; fi
          done

      - name: Report setup.log on failure
        if: failure()
        run: |
          # annotations are visible on the run page without downloading logs
          if [ -f data/setup.log ]; then
            msg=$(tail -n 40 data/setup.log | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=setup.log (${{ runner.os }})::$msg"
          fi
